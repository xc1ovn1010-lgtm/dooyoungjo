<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 노래 추천</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1219;
    --bg-card: #171B24;
    --border: #262B38;
    --text: #ECEDF2;
    --text-muted: #8B92A5;
    --accent: #E8A33D;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: radial-gradient(circle at 50% -10%, #1B2030 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 64px;
    transition: background 0.6s ease;
  }

  .app { width: 100%; max-width: 480px; }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 28px;
  }

  header.top .brand {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
  }

  header.top .today {
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .disc-card, .playlist-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
  }

  .disc-card { margin-bottom: 20px; }

  .disc-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
  }

  .disc {
    width: 168px;
    height: 168px;
    transition: transform 0.4s ease;
  }

  @media (prefers-reduced-motion: no-preference) {
    .disc.spin { animation: spin 26s linear infinite; }
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .status-block { text-align: center; }

  .status-block .mood-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.8rem;
    line-height: 1.15;
    margin: 0;
    color: var(--accent);
    transition: color 0.6s ease;
  }

  .status-block .mood-desc {
    font-size: 0.88rem;
    color: var(--text-muted);
    margin: 10px auto 0;
    max-width: 320px;
    line-height: 1.55;
  }

  .mood-chips {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .chip {
    font-family: 'Manrope', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #10131C;
    color: var(--text-muted);
    padding: 8px 14px;
    cursor: pointer;
  }

  .chip:hover { color: var(--text); border-color: var(--accent); }

  .chip.active {
    color: #10131C;
    background: var(--accent);
    border-color: var(--accent);
  }

  .refresh-row {
    margin-top: 18px;
    text-align: center;
  }

  button.primary {
    font-family: 'Manrope', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    border-radius: 12px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #10131C;
    padding: 12px 22px;
    cursor: pointer;
  }

  button.primary:hover { opacity: 0.9; }

  .chip:focus-visible,
  button:focus-visible,
  a.link-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .playlist-card h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.15rem;
    margin: 0 0 4px;
  }

  .playlist-sub {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin: 0 0 18px;
  }

  ol.tracklist { list-style: none; margin: 0; padding: 0; }

  ol.tracklist li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 0;
    border-top: 1px solid var(--border);
  }

  ol.tracklist li:first-child { border-top: none; }

  .track-num {
    font-family: 'Fraunces', serif;
    font-size: 0.95rem;
    color: var(--accent);
    width: 20px;
    flex-shrink: 0;
  }

  .track-info { flex: 1; min-width: 0; }

  .track-title {
    font-size: 0.92rem;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-artist {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin: 2px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-links { display: flex; gap: 6px; flex-shrink: 0; }

  a.link-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.72rem;
    font-weight: 700;
  }

  a.link-btn:hover { color: var(--accent); border-color: var(--accent); }

  footer.note {
    text-align: center;
    color: #4B5266;
    font-size: 0.74rem;
    margin-top: 22px;
    line-height: 1.6;
  }

  @media (max-width: 380px) {
    .disc { width: 140px; height: 140px; }
    .status-block .mood-name { font-size: 1.5rem; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="top">
      <span class="brand">오늘의 노래 추천</span>
      <span class="today" id="todayLabel"></span>
    </header>

    <main>
      <section class="disc-card">
        <div class="disc-wrap">
          <svg class="disc" id="discSvg" viewBox="0 0 100 100" role="img" aria-label="선택된 기분 아이콘">
            <circle cx="50" cy="50" r="49" fill="#12151E" stroke="#262B38" stroke-width="1"/>
            <circle cx="50" cy="50" r="40" fill="none" stroke="#20242F" stroke-width="1"/>
            <circle cx="50" cy="50" r="33" fill="none" stroke="#20242F" stroke-width="1"/>
            <circle cx="50" cy="50" r="26" fill="none" stroke="#20242F" stroke-width="1"/>
            <circle cx="50" cy="50" r="19" fill="#171B24" stroke="var(--accent)" stroke-width="1.4"/>
            <g id="moodIcon" transform="translate(50,50)" stroke="var(--accent)" fill="var(--accent)"></g>
            <circle cx="50" cy="50" r="2.2" fill="#0F1219" stroke="var(--accent)" stroke-width="1"/>
          </svg>
        </div>

        <div class="status-block">
          <p class="mood-name" id="moodName">기분을 골라보세요</p>
          <p class="mood-desc" id="moodDesc">아래에서 기분을 고르거나, 바로 추천받기를 눌러보세요.</p>
        </div>

        <div class="mood-chips" id="moodChips"></div>

        <div class="refresh-row">
          <button class="primary" id="refreshBtn" type="button">노래 추천받기</button>
        </div>
      </section>

      <section class="playlist-card">
        <h2>추천 플레이리스트</h2>
        <p class="playlist-sub" id="playlistSub">추천받기를 누르면 곡이 채워져요.</p>
        <ol class="tracklist" id="trackList"></ol>
      </section>
    </main>

    <footer class="note">
      원할 때마다 추천받기를 눌러 새로운 곡을 받아보세요.<br/>
      기분을 고르면 그 분위기에 맞는 곡만 추천돼요.
    </footer>
  </div>

    moodDesc: document.getElementById("moodDesc"),
    icon: document.getElementById("moodIcon"),
    disc: document.getElementById("discSvg"),

    playlistSub: document.getElementById("playlistSub"),
    chips: document.getElementById("moodChips"),

    root: document.documentElement
  };

  function setToday() {
    const now = new Date();
    els.today.textContent = now.toLocaleDateString("ko-KR", {
      year: "numeric", month: "long", day: "numeric", weekday: "short"
    });
  }

  function buildChips() {
    const allChip = document.createElement("button");
    allChip.type = "button";
    allChip.className = "chip active";
    allChip.textContent = "랜덤";
    allChip.dataset.mood = "";
    els.chips.appendChild(allChip);

    MOOD_KEYS.forEach((key) => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = MOODS[key].label;
      chip.dataset.mood = key;
      els.chips.appendChild(chip);
    });

    els.chips.addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      currentMood = btn.dataset.mood || null;
      [...els.chips.querySelectorAll(".chip")].forEach((c) => c.classList.toggle("active", c === btn));
      recommend();
    });
  }

  function shuffle(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function recommend() {
    const key = currentMood || MOOD_KEYS[Math.floor(Math.random() * MOOD_KEYS.length)];
    const data = MOODS[key];

    els.root.style.setProperty("--accent", data.accent);
    els.icon.innerHTML = data.icon;
    els.disc.classList.add("spin");
    els.moodName.textContent = data.label;
    els.moodDesc.textContent = data.desc;

    const tracks = shuffle(data.tracks).slice(0, 5);
    els.playlistSub.textContent = `${data.label} 분위기의 곡 ${tracks.length}가지예요.`;
    els.trackList.innerHTML = "";
    tracks.forEach((t, i) => {
      const li = document.createElement("li");
      const q = encodeURIComponent(`${t.title} ${t.artist}`);
      li.innerHTML = `
        <span class="track-num">${i + 1}</span>
        <span class="track-info">
          <p class="track-title">${t.title}</p>
          <p class="track-artist">${t.artist}</p>
        </span>
        <span class="track-links">
          <a class="link-btn" href="https://open.spotify.com/search/${q}" target="_blank" rel="noopener" aria-label="${t.title} Spotify에서 검색">S</a>
          <a class="link-btn" href="https://music.youtube.com/search?q=${q}" target="_blank" rel="noopener" aria-label="${t.title} YouTube Music에서 검색">Y</a>
        </span>`;
      els.trackList.appendChild(li);
    });
  }

  els.refreshBtn.addEventListener("click", recommend);

  setToday();
  buildChips();
  recommend();
})();
</script>
</body>
</html>
